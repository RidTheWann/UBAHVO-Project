name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

concurrency:
  # Use the PR source branch for both push and pull_request events so the same commit is not built twice.
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust and test native core
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
            sh /tmp/rustup-init.sh -y --profile minimal --component rustfmt
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          else
            rustup toolchain install stable --profile minimal --component rustfmt
            rustup default stable
          fi
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo fmt --manifest-path app/src/main/rust/Cargo.toml -- --check
          cargo test --manifest-path app/src/main/rust/Cargo.toml --locked

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ""

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null

      - name: Install Android build and native runtime SDKs
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="27.2.12479018"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "Android SDK root is not configured." >&2
            exit 1
          fi

          NDK_ROOT="$SDK_ROOT/ndk/$NDK_VERSION"
          ndk_is_ready() {
            local host_root="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
            [[ -x "$host_root/bin/clang" &&
               -s "$host_root/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" &&
               -s "$host_root/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so" &&
               -s "$host_root/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so" ]]
          }

          for attempt in 1 2 3; do
            echo "Installing Android SDK packages (attempt $attempt/3)."
            if sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;$NDK_VERSION" &&
               ndk_is_ready; then
              echo "Android SDK platform, Build Tools, and NDK are installed and verified."
              exit 0
            fi

            echo "SDK/NDK installation attempt $attempt failed or left an incomplete NDK." >&2
            # sdkmanager can leave a partial extraction and cached archive after a truncated download.
            rm -rf "$NDK_ROOT" "$SDK_ROOT/.temp" "$HOME/.android/cache"
            if [[ "$attempt" -lt 3 ]]; then
              sleep "$((attempt * 10))"
            fi
          done

          echo "Android NDK $NDK_VERSION could not be installed and verified after 3 attempts." >&2
          exit 1

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Run Android tests and build ABI APKs
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Build optimized AAB candidate without ABI splits
        run: gradle --no-daemon -Pubahvo.bundleOnly=true :app:bundleRelease

      - name: Verify universal and ABI-specific UBAHVO APKs
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          if [[ -z "$VERSION" ]]; then
            echo "Could not read UBAHVO versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          APK="app/build/outputs/apk/debug/UBAHVO-${VERSION}-universal-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "Missing or empty universal APK: $APK" >&2
            exit 1
          fi

          APK_SIZE_BYTES="$(stat -c '%s' "$APK")"
          echo "Universal APK size: $APK_SIZE_BYTES bytes (target: less than 100,000,000 bytes)."
          {
            echo "### Universal APK size"
            printf -- '- File: `%s`\n' "$APK"
            echo "- Size: $APK_SIZE_BYTES bytes"
            echo "- Target: under 100,000,000 bytes"
          } >> "$GITHUB_STEP_SUMMARY"
          if (( APK_SIZE_BYTES >= 100000000 )); then
            echo "::warning title=Universal APK size::The universal APK is $APK_SIZE_BYTES bytes, above the 100 MB download target."
          fi
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            if ! unzip -Z1 "$APK" | grep -Fqx "lib/$ABI/libc++_shared.so"; then
              echo "Universal APK is missing the C++ runtime for $ABI." >&2
              exit 1
            fi
            if ! unzip -Z1 "$APK" | grep -Fqx "lib/$ABI/libubahvo_native.so"; then
              echo "Universal APK is missing the UBAHVO Rust/C++ native core for $ABI." >&2
              exit 1
            fi
            if ! unzip -Z1 "$APK" | grep -Eq "^lib/$ABI/[^/]+\\.so$"; then
              echo "Universal APK is missing native libraries for $ABI." >&2
              exit 1
            fi
          done

          # Verify each architecture-specific APK is lean and contains the matching native runtime.
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            SPLIT_APK="app/build/outputs/apk/debug/UBAHVO-${VERSION}-${ABI}-debug.apk"
            if [[ ! -s "$SPLIT_APK" ]]; then
              echo "Missing or empty ABI-specific APK: $SPLIT_APK" >&2
              exit 1
            fi
            if ! unzip -Z1 "$SPLIT_APK" | grep -Fqx "lib/$ABI/libc++_shared.so"; then
              echo "ABI APK is missing the matching C++ runtime for $ABI." >&2
              exit 1
            fi
            if ! unzip -Z1 "$SPLIT_APK" | grep -Fqx "lib/$ABI/libubahvo_native.so"; then
              echo "ABI APK is missing the Rust/C++ core for $ABI." >&2
              exit 1
            fi
            SPLIT_SIZE_BYTES="$(stat -c '%s' "$SPLIT_APK")"
            echo "ABI APK size ($ABI): $SPLIT_SIZE_BYTES bytes."
            printf -- '- %s APK: %s bytes\n' "$ABI" "$SPLIT_SIZE_BYTES" >> "$GITHUB_STEP_SUMMARY"
            if (( SPLIT_SIZE_BYTES >= 100000000 )); then
              echo "::warning title=ABI APK size::The $ABI APK is $SPLIT_SIZE_BYTES bytes, above the 100 MB download target."
            fi
          done

          # Verify the optimized App Bundle build exists. It is intentionally not Play-uploadable
          # until it is signed with the owner's permanent upload key.
          AAB="app/build/outputs/bundle/release/app-release.aab"
          if [[ ! -s "$AAB" ]]; then
            echo "Missing or empty optimized release App Bundle candidate: $AAB" >&2
            exit 1
          fi
          echo "Optimized unsigned AAB candidate: $(stat -c '%s' "$AAB") bytes."

          # Verify the minified APK kept the reflective no-argument constructor that
          # Apache Commons Compress 1.12 uses to register AsiExtraField at class init.
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "Android SDK root is not configured for APK verification." >&2
            exit 1
          fi
          APKANALYZER="$(find "$SDK_ROOT/cmdline-tools" -type f -name apkanalyzer -print -quit)"
          if [[ -z "$APKANALYZER" || ! -x "$APKANALYZER" ]]; then
            echo "apkanalyzer was not found in the installed Android SDK command-line tools." >&2
            exit 1
          fi
          CLASS_DUMP="$(mktemp)"
          trap 'rm -f "$CLASS_DUMP"' EXIT
          "$APKANALYZER" dex code --class org.apache.commons.compress.archivers.zip.AsiExtraField "$APK" > "$CLASS_DUMP"
          if ! grep -Eq '^[[:space:]]*\.method[[:space:]]+public.*<init>\(\)V' "$CLASS_DUMP"; then
            echo "Minified APK is missing AsiExtraField's public no-argument constructor." >&2
            exit 1
          fi
          echo "Apache Commons Compress reflection constructor is present in the minified APK."

      - name: Upload UBAHVO universal APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ubahvo-beta-apks
          path: app/build/outputs/apk/debug/UBAHVO-*-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned optimized App Bundle candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ubahvo-unsigned-release-aab-candidate
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
