name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ""

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null

      - name: Install Android build and native runtime SDKs
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="27.2.12479018"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "Android SDK root is not configured." >&2
            exit 1
          fi

          NDK_ROOT="$SDK_ROOT/ndk/$NDK_VERSION"
          ndk_is_ready() {
            local host_root="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
            [[ -x "$host_root/bin/clang" &&
               -s "$host_root/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" &&
               -s "$host_root/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so" ]]
          }

          for attempt in 1 2 3; do
            echo "Installing Android SDK packages (attempt $attempt/3)."
            if sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION" &&
               ndk_is_ready; then
              echo "Android SDK platform, Build Tools, and NDK are installed and verified."
              exit 0
            fi

            echo "SDK/NDK installation attempt $attempt failed or left an incomplete NDK." >&2
            # sdkmanager can leave a partial extraction and cached archive after a truncated download.
            rm -rf "$NDK_ROOT" "$SDK_ROOT/.temp" "$HOME/.android/cache"
            if [[ "$attempt" -lt 3 ]]; then
              sleep "$((attempt * 10))"
            fi
          done

          echo "Android NDK $NDK_VERSION could not be installed and verified after 3 attempts." >&2
          exit 1

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Run unit tests and assemble the universal ARM APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify universal UBAHVO ARM APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          if [[ -z "$VERSION" ]]; then
            echo "Could not read UBAHVO versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          APK="app/build/outputs/apk/debug/UBAHVO-${VERSION}-universal-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "Missing or empty universal APK: $APK" >&2
            exit 1
          fi
          for ABI in arm64-v8a armeabi-v7a; do
            if ! unzip -Z1 "$APK" | grep -Fqx "lib/$ABI/libc++_shared.so"; then
              echo "Universal APK is missing the C++ runtime for $ABI." >&2
              exit 1
            fi
            if ! unzip -Z1 "$APK" | grep -Eq "^lib/$ABI/[^/]+\\.so$"; then
              echo "Universal APK is missing native libraries for $ABI." >&2
              exit 1
            fi
          done

          # Verify the minified APK kept the reflective no-argument constructor that
          # Apache Commons Compress 1.12 uses to register AsiExtraField at class init.
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKANALYZER="$(find "$SDK_ROOT/cmdline-tools" -type f -name apkanalyzer -print -quit)"
          if [[ -z "$APKANALYZER" || ! -x "$APKANALYZER" ]]; then
            echo "apkanalyzer was not found in the installed Android SDK command-line tools." >&2
            exit 1
          fi
          CLASS_DUMP="$(mktemp)"
          trap 'rm -f "$CLASS_DUMP"' EXIT
          "$APKANALYZER" dex code --class org.apache.commons.compress.archivers.zip.AsiExtraField "$APK" > "$CLASS_DUMP"
          if ! grep -Fq '<init>()V' "$CLASS_DUMP"; then
            echo "Minified APK is missing AsiExtraField's public no-argument constructor." >&2
            exit 1
          fi
          echo "Apache Commons Compress reflection constructor is present in the minified APK."

      - name: Upload UBAHVO universal APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ubahvo-universal-arm-apk
          path: app/build/outputs/apk/debug/UBAHVO-*-universal-debug.apk
          if-no-files-found: error
          retention-days: 14
