name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ""

      - name: Install Android build and native runtime SDKs
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          yes | sdkmanager --licenses >/dev/null

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Run unit tests and assemble ABI-split APKs
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify universal UBAHVO ARM APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\\([^"]*\\)".*/\\1/p' app/build.gradle.kts | head -n1)"
          if [[ -z "$VERSION" ]]; then
            echo "Could not read UBAHVO versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          APK="app/build/outputs/apk/debug/UBAHVO-${VERSION}-universal-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "Missing or empty universal APK: $APK" >&2
            exit 1
          fi
          for ABI in arm64-v8a armeabi-v7a; do
            if ! unzip -Z1 "$APK" | grep -Fqx "lib/$ABI/libc++_shared.so"; then
              echo "Universal APK is missing the C++ runtime for $ABI." >&2
              exit 1
            fi
            if ! unzip -Z1 "$APK" | grep -Eq "^lib/$ABI/[^/]+\\.so$"; then
              echo "Universal APK is missing native libraries for $ABI." >&2
              exit 1
            fi
          done

      - name: Upload UBAHVO universal APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ubahvo-universal-arm-apk
          path: app/build/outputs/apk/debug/UBAHVO-*-universal-debug.apk
          if-no-files-found: error
          retention-days: 14
