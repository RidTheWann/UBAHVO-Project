name: Android Beta Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ""

      - name: Install Android build and native runtime SDKs
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          yes | sdkmanager --licenses >/dev/null

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          if [[ -z "$VERSION" ]]; then
            echo "Could not read app versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.version.outputs.tag }} already exists; avoiding duplicate release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests and build ABI-split beta APKs
        if: steps.existing.outputs.exists != 'true'
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare release assets and checksums
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          TAG="${{ steps.version.outputs.tag }}"
          ABIS=("arm64-v8a" "armeabi-v7a" "x86_64" "x86")
          for ABI in "${ABIS[@]}"; do
            SOURCE="app/build/outputs/apk/debug/app-${ABI}-debug.apk"
            DEST="dist/Youtube-Convert-${TAG}-${ABI}-debug.apk"
            if [[ ! -s "$SOURCE" ]]; then
              echo "Missing or empty ABI APK: $SOURCE" >&2
              exit 1
            fi
            if ! unzip -Z1 "$SOURCE" | grep -Fqx "lib/$ABI/libc++_shared.so"; then
              echo "The APK for $ABI is missing its C++ runtime." >&2
              exit 1
            fi
            cp "$SOURCE" "$DEST"
          done
          (
            cd dist
            sha256sum Youtube-Convert-*.apk > SHA256SUMS.txt
          )
          cat > dist/RELEASE_NOTES.md <<EOF
          # Youtube Convert ${TAG}

          **Pre-release beta — not a production-signed stable build.**

          ## Included
          - Native Android app built with Kotlin, Jetpack Compose and Material 3.
          - MP4 output with selectable video quality and MP3 audio extraction.
          - Progress and cancellation, scoped storage publication, open/share actions, and recent conversion history.
          - URL validation, SHA-256-verified stable yt-dlp updates, native runtime repair, and automated unit/build checks.
          - Architecture-specific APKs to avoid bundling native libraries for every CPU architecture into a single large download.

          ## Which APK should I install?
          - **arm64-v8a**: most modern Android phones.
          - **armeabi-v7a**: older 32-bit ARM devices.
          - **x86_64 / x86**: Android emulators and compatible Intel devices.
          Check your device ABI if unsure.

          ## Important limitations
          - These APKs are built from the Android debug variant and signed with the CI runner's debug key. They are for early testing; later CI builds may use a different key and may require uninstalling the previous beta before installing a new build.
          - The FFmpeg 0.18.1 package has an upstream report about missing libc++_shared.so (https://github.com/yausername/youtubedl-android/issues/369); this app stages the ABI-matched NDK runtime into FFmpeg's private library path as a workaround. This has not yet been validated by physical-device smoke tests.
          - The bundled FFmpeg dependency also has a reported 16 KB page-size alignment issue (https://github.com/yausername/youtubedl-android/issues/365). The app conservatively disables conversion on devices whose page size is not confirmed as 4 KB.
          - CI verifies unit tests, APK assembly and inclusion of the C++ runtime; it does not replace real-device end-to-end testing of media downloads and playback.
          - Download only media you own or are authorized to download. No DRM bypass, cookie import, or private/paid-content access is provided.
          EOF

      - name: Publish GitHub prerelease
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Youtube Convert ${{ steps.version.outputs.tag }}
          body_path: dist/RELEASE_NOTES.md
          draft: false
          prerelease: true
          make_latest: false
          files: |
            dist/Youtube-Convert-${{ steps.version.outputs.tag }}-arm64-v8a-debug.apk
            dist/Youtube-Convert-${{ steps.version.outputs.tag }}-armeabi-v7a-debug.apk
            dist/Youtube-Convert-${{ steps.version.outputs.tag }}-x86_64-debug.apk
            dist/Youtube-Convert-${{ steps.version.outputs.tag }}-x86-debug.apk
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
