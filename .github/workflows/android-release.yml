name: Android Beta Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust and test native core
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
            sh /tmp/rustup-init.sh -y --profile minimal --component rustfmt
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          else
            rustup toolchain install stable --profile minimal --component rustfmt
            rustup default stable
          fi
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo fmt --manifest-path app/src/main/rust/Cargo.toml -- --check
          cargo test --manifest-path app/src/main/rust/Cargo.toml --locked

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ""

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null

      - name: Install Android build and native runtime SDKs
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="27.2.12479018"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "Android SDK root is not configured." >&2
            exit 1
          fi

          NDK_ROOT="$SDK_ROOT/ndk/$NDK_VERSION"
          ndk_is_ready() {
            local host_root="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
            [[ -x "$host_root/bin/clang" &&
               -s "$host_root/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" &&
               -s "$host_root/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so" &&
               -s "$host_root/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so" ]]
          }

          for attempt in 1 2 3; do
            echo "Installing Android SDK packages (attempt $attempt/3)."
            if sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;$NDK_VERSION" &&
               ndk_is_ready; then
              echo "Android SDK platform, Build Tools, and NDK are installed and verified."
              exit 0
            fi

            echo "SDK/NDK installation attempt $attempt failed or left an incomplete NDK." >&2
            # sdkmanager can leave a partial extraction and cached archive after a truncated download.
            rm -rf "$NDK_ROOT" "$SDK_ROOT/.temp" "$HOME/.android/cache"
            if [[ "$attempt" -lt 3 ]]; then
              sleep "$((attempt * 10))"
            fi
          done

          echo "Android NDK $NDK_VERSION could not be installed and verified after 3 attempts." >&2
          exit 1

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          if [[ -z "$VERSION" ]]; then
            echo "Could not read app versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.version.outputs.tag }} already exists; avoiding duplicate release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Android tests and build ABI APKs
        if: steps.existing.outputs.exists != 'true'
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Build optimized AAB candidate without ABI splits
        if: steps.existing.outputs.exists != 'true'
        run: gradle --no-daemon -Pubahvo.bundleOnly=true :app:bundleRelease

      - name: Prepare the universal APK and checksum
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          SOURCE="app/build/outputs/apk/debug/UBAHVO-${VERSION}-universal-debug.apk"
          DEST="dist/UBAHVO-${VERSION}-universal-debug.apk"
          if [[ ! -s "$SOURCE" ]]; then
            echo "Missing or empty universal APK: $SOURCE" >&2
            exit 1
          fi

          APK_SIZE_BYTES="$(stat -c '%s' "$SOURCE")"
          APK_SIZE_MB="$(awk -v size="$APK_SIZE_BYTES" 'BEGIN { printf "%.1f", size / 1000000 }')"
          echo "Universal APK download size: $APK_SIZE_BYTES bytes (~$APK_SIZE_MB MB decimal)."
          if (( APK_SIZE_BYTES >= 100000000 )); then
            echo "::warning title=Universal APK size::The universal APK is $APK_SIZE_BYTES bytes, above the 100 MB download target."
          fi
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            if ! unzip -Z1 "$SOURCE" | grep -Fqx "lib/$ABI/libc++_shared.so"; then
              echo "Universal APK is missing the C++ runtime for $ABI." >&2
              exit 1
            fi
            if ! unzip -Z1 "$SOURCE" | grep -Fqx "lib/$ABI/libubahvo_native.so"; then
              echo "Universal APK is missing the UBAHVO Rust/C++ native core for $ABI." >&2
              exit 1
            fi
          done

          # Publish smaller ABI-specific downloads beside the one-file universal option.
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            SPLIT_SOURCE="app/build/outputs/apk/debug/UBAHVO-${VERSION}-${ABI}-debug.apk"
            SPLIT_DEST="dist/UBAHVO-${VERSION}-${ABI}-debug.apk"
            if [[ ! -s "$SPLIT_SOURCE" ]]; then
              echo "Missing or empty ABI-specific APK: $SPLIT_SOURCE" >&2
              exit 1
            fi
            if ! unzip -Z1 "$SPLIT_SOURCE" | grep -Fqx "lib/$ABI/libc++_shared.so"; then
              echo "ABI APK is missing the C++ runtime for $ABI." >&2
              exit 1
            fi
            if ! unzip -Z1 "$SPLIT_SOURCE" | grep -Fqx "lib/$ABI/libubahvo_native.so"; then
              echo "ABI APK is missing the Rust/C++ core for $ABI." >&2
              exit 1
            fi
            cp "$SPLIT_SOURCE" "$SPLIT_DEST"
            SPLIT_SIZE_BYTES="$(stat -c '%s' "$SPLIT_DEST")"
            echo "$ABI APK download size: $SPLIT_SIZE_BYTES bytes."
          done

          # Verify CI can package the optimized release App Bundle. This candidate remains
          # unsigned until a permanent owner-controlled upload key is configured securely.
          AAB="app/build/outputs/bundle/release/app-release.aab"
          if [[ ! -s "$AAB" ]]; then
            echo "Missing or empty optimized release AAB candidate: $AAB" >&2
            exit 1
          fi
          echo "Unsigned optimized AAB candidate: $(stat -c '%s' "$AAB") bytes."

          # Confirm R8 did not remove the public no-arg constructor used reflectively by
          # Apache Commons Compress 1.12 when registering ZIP extra-field implementations.
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "Android SDK root is not configured for APK verification." >&2
            exit 1
          fi
          APKANALYZER="$(find "$SDK_ROOT/cmdline-tools" -type f -name apkanalyzer -print -quit)"
          if [[ -z "$APKANALYZER" || ! -x "$APKANALYZER" ]]; then
            echo "apkanalyzer was not found in the installed Android SDK command-line tools." >&2
            exit 1
          fi
          CLASS_DUMP="$(mktemp)"
          trap 'rm -f "$CLASS_DUMP"' EXIT
          "$APKANALYZER" dex code --class org.apache.commons.compress.archivers.zip.AsiExtraField "$SOURCE" > "$CLASS_DUMP"
          if ! grep -Eq '^[[:space:]]*\.method[[:space:]]+public.*<init>\(\)V' "$CLASS_DUMP"; then
            echo "Minified APK is missing AsiExtraField's public no-argument constructor." >&2
            exit 1
          fi
          echo "Apache Commons Compress reflection constructor is present in the minified APK."
          cp "$SOURCE" "$DEST"
          (
            cd dist
            sha256sum UBAHVO-"$VERSION"-*-debug.apk > SHA256SUMS.txt
          )
          cat > dist/RELEASE_NOTES.md <<EOF
          # UBAHVO ${TAG}

          **Pre-release beta — debug-signed, not a production-stable build.**

          **Download size:** approximately ${APK_SIZE_MB} MB (${APK_SIZE_BYTES} bytes; decimal units).

          ## Choose your APK
          - **Universal (simplest):** UBAHVO-${VERSION}-universal-debug.apk includes arm64-v8a, armeabi-v7a, and x86_64 native runtimes in one file. Its download size may exceed the 100 MB target because it bundles every ABI.
          - **Most current Android phones:** UBAHVO-${VERSION}-arm64-v8a-debug.apk is for 64-bit ARM devices.
          - **32-bit ARM phones:** UBAHVO-${VERSION}-armeabi-v7a-debug.apk is for supported 32-bit ARM devices.
          - **Emulators / compatible Intel Android devices:** UBAHVO-${VERSION}-x86_64-debug.apk is the x86_64 build.
          Install only the ABI-specific APK matching the device. All variants enable R8 and resource shrinking; ABI-specific packages avoid downloading unrelated native runtimes.

          ## What's included
          - Kotlin + Jetpack Compose interface with plain-language Indonesian labels.
          - MP4 video or MP3 audio from supported HTTPS media links across multiple yt-dlp extractors. Site coverage varies; playlists and batch downloads remain unsupported.
          - Convert a user-selected local audio/video file to MP3 or MP4 with the bundled FFmpeg tools when the input streams and available encoders are compatible. Choose "File perangkat" in the app and select a file through Android's document picker; outputs are saved to Download/UBAHVO.
          - First-party image saving from direct public HTTPS image URLs or the primary image exposed through public Open Graph/Twitter metadata. Recognized image signatures include JPEG, PNG, WebP, GIF, AVIF, HEIC, and BMP. A social post may expose only its preview/cover image; this release does not claim full carousel extraction.
          - Animated "Selamat Datang" startup screen followed by a loader while native media components initialize.
          - Automatic checks for verified yt-dlp support-component updates on the maintenance schedule, plus periodic checks for new UBAHVO releases. Update notices use Android notifications when permission is granted and an in-app notice otherwise; installation remains a user-confirmed Android action.
          - Progress, cancellation, recent output history, and open/share actions. Media-support component updates are verified over HTTPS with the official GitHub-published SHA-256 digest before installation.
          - New output files are saved in Download/UBAHVO. Legacy files in Download/YoutubeConvert remain where they are; the app attempts to include them in recent history.

          ## Important compatibility notes
          - New application ID: com.ridthewann.ubahvo. Android treats this as a separate app from older builds with ID com.ridthewann.youtubeconvert; this app installs alongside the older installation. Keep both until you have verified UBAHVO and backed up important files; uninstalling an app does not move its existing output files.
          - The current FFmpeg 0.18.1 dependency has a reported 16 KB page-size alignment problem (https://github.com/yausername/youtubedl-android/issues/365). UBAHVO conservatively disables conversion when the device page size is not verified as 4 KB, so this beta cannot convert on every 16 KB-page phone yet.
          - These APKs are built from the Android debug variant and signed with the CI runner's debug key. Later beta builds can require reinstalling.
          - CI also builds an optimized release Android App Bundle (AAB) candidate, but this artifact is unsigned and is not a Play-ready release. A permanent owner-controlled upload key must be configured through secure CI signing settings.
          - Native conversion remains guarded on devices whose memory page size is not verified as 4 KB because the bundled FFmpeg 0.18.1 payload has a reported 16 KB alignment issue. Supporting x86_64 does not fix that upstream issue.
          - CI validates unit tests, local-conversion planning, APK assembly, ABI-native runtime presence, and AAB packaging; it is not a substitute for physical-device link-based and local-file MP3/MP4 smoke tests.
          - Download only content you own or are authorized to download. No DRM bypass, cookie import, or private/paid-content access is provided.
          EOF

      - name: Publish GitHub prerelease
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: UBAHVO ${{ steps.version.outputs.tag }}
          body_path: dist/RELEASE_NOTES.md
          draft: false
          prerelease: true
          make_latest: false
          files: |
            dist/UBAHVO-${{ steps.version.outputs.version }}-universal-debug.apk
            dist/UBAHVO-${{ steps.version.outputs.version }}-arm64-v8a-debug.apk
            dist/UBAHVO-${{ steps.version.outputs.version }}-armeabi-v7a-debug.apk
            dist/UBAHVO-${{ steps.version.outputs.version }}-x86_64-debug.apk
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
