name: Android Beta Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ""

      - name: Install Android build and native runtime SDKs
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          yes | sdkmanager --licenses >/dev/null

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          if [[ -z "$VERSION" ]]; then
            echo "Could not read app versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.version.outputs.tag }} already exists; avoiding duplicate release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests and build one universal ARM beta APK
        if: steps.existing.outputs.exists != 'true'
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare the universal APK and checksum
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          SOURCE="app/build/outputs/apk/debug/UBAHVO-${VERSION}-universal-debug.apk"
          DEST="dist/UBAHVO-${VERSION}-universal-debug.apk"
          if [[ ! -s "$SOURCE" ]]; then
            echo "Missing or empty universal APK: $SOURCE" >&2
            exit 1
          fi
          for ABI in arm64-v8a armeabi-v7a; do
            if ! unzip -Z1 "$SOURCE" | grep -Fqx "lib/$ABI/libc++_shared.so"; then
              echo "Universal APK is missing the C++ runtime for $ABI." >&2
              exit 1
            fi
          done
          cp "$SOURCE" "$DEST"
          (
            cd dist
            sha256sum "UBAHVO-${VERSION}-universal-debug.apk" > SHA256SUMS.txt
          )
          cat > dist/RELEASE_NOTES.md <<EOF
          # UBAHVO ${TAG}

          **Pre-release beta — debug-signed, not a production-stable build.**

          ## One APK for Android phones
          Download UBAHVO-${VERSION}-universal-debug.apk. It includes both 64-bit ARM (arm64-v8a) and 32-bit ARM (armeabi-v7a) native runtimes in one file. x86/x86_64 emulators and Intel Android devices are not included. R8 code/resource shrinking and compressed native-library packaging are enabled, but a universal APK is still larger than an APK containing only one ABI.

          ## What's included
          - Kotlin + Jetpack Compose interface with plain-language labels.
          - MP4 video or MP3 audio from supported single-video YouTube URLs.
          - Progress, cancellation, recent output history, open/share actions, and a user-triggered yt-dlp updater with SHA-256 verification.
          - New output files are saved in Download/UBAHVO. Legacy files in Download/YoutubeConvert remain where they are; the app attempts to include them in recent history.

          ## Important compatibility notes
          - New application ID: com.ridthewann.ubahvo. Android treats this as a separate app from older builds with ID com.ridthewann.youtubeconvert; this beta does not update the older installation in place. Test beta.8 before removing the old app, and back up important files first.
          - The current FFmpeg 0.18.1 dependency has a reported 16 KB page-size alignment problem (https://github.com/yausername/youtubedl-android/issues/365). UBAHVO conservatively disables conversion when the device page size is not verified as 4 KB, so this beta cannot convert on every 16 KB-page phone yet.
          - These APKs are built from the Android debug variant and signed with the CI runner's debug key. Later beta builds can require reinstalling.
          - CI validates unit tests, APK assembly, and native runtime presence; it is not a substitute for physical-device MP3/MP4 smoke tests.
          - Download only content you own or are authorized to download. No DRM bypass, cookie import, or private/paid-content access is provided.
          EOF

      - name: Publish GitHub prerelease
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: UBAHVO ${{ steps.version.outputs.tag }}
          body_path: dist/RELEASE_NOTES.md
          draft: false
          prerelease: true
          make_latest: false
          files: |
            dist/UBAHVO-${{ steps.version.outputs.version }}-universal-debug.apk
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
